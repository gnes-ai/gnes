!PipelineEncoder
component:
  - !BasePytorchEncoder
    parameter:
      model_dir: /ext_data/image_encoder
      model_name: mobilenet_v2
      layers:
        - features
        - x.mean([2, 3])
    property:
      is_trained: true
  - !PCALocalEncoder
    parameter:
      output_dim: 500
      num_locals: 10
    property:
      batch_size: 2048
